<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/todolist.css">
    <title>Lesson20 - Exercises - Tran Xuan Nguyen - Todo List</title>
</head>

<body>
 <div class="todo">
    <!-- todo-header  -->
    <div class="todo-header">
        <h2>Todo List-App</h2>
    </div>  
    <!-- todo-body  -->
    <div class="todo-body">
       <!-- body-header -->
       <div class="add-block">
        <input type="text" class="add-text" placeholder="A task you want to complete">
        <button class="add-button">+</button>
    </div>
    <!-- body-body -->
    <ul class="tasks sort-list">
        <li class="task">
            <div class="col1">
                <input class="task-cbx" type="checkbox">
            </div>
            <div class="task-text col2">Task 01</div>
            <div class="task-remove col3"></div>
        </li>
        <li class="task">
            <div class="col1">
                <input class="task-cbx" type="checkbox">
            </div>
            <div class="task-text col2">Task 02</div>
            <div class="task-remove col3"></div>
        </li>
        <li class="task">
            <div class="col1">
                <input class="task-cbx" type="checkbox">
            </div>
            <div class="task-text col2">Task 03</div>
            <div class="task-remove col3"></div>
        </li>
        <li class="task">
            <div class="col1">
                <input class="task-cbx" type="checkbox">
            </div>
            <div class="task-text col2">Task 04</div>
            <div class="task-remove col3"></div>
        </li>
    </ul>
</div>         
</div>
</body>
</html>
