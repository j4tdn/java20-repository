<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>LESSON 22 - TODO APP</title>
	<link rel="icon" href="images/happy.jpg">
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<!-- 
	Thua
	==> đuôi ball chạm phần trên cùng của window
	+ những ball hiện tại cứ cho chạy hết [nothing] nhưng
	  disable chức năng pop
	+ không tạo ra ball mới
	+ hiện popup thua
	  . play again
	    ^ ẩn popup thua
	    ^ xóa các ball(disable) của game trước
	    ^ reset điểm
	    ^ generate new balls
      . exit
        ^ ẩn popup thua
        ^ cho ball còn lại chạy hết

	Thắng
	==> Số lần pop = tổng số điểm yêu cầu theo level
	+ những ball hiện tại cứ cho chạy hết [nothing] nhưng
	  disable chức năng pop
	+ không hiện ra ball mới
	+ hiện popup thắng

	Ý tưởng làm thêm
	---------------
	1. Ý tưởng 1
	+ Mặc định level 1, biến 'currentLevel'
	+ Khi thắng bấm 'next-level', tăng biến currentLevel lên 1 đơn vị
	  ==> tổng số điểm cần thắng cho level
	  ==> sau bao lâu thì tạo ra new ball
	  ==> sau bao lâu thì dịch chuyển ball 1px

	-->

	<div class="balloon-wl-container">
		<div class="wl-block">
			<div class="loose">
				<h4>Sorry - You lose the game</h4>
				<img src="images/sad.png" alt="sad">
				<h4>You popped <span class="current-score">*</span> balloon(s)</h4>
				<h4>Play again?</h4>
				<button class="play-again-yes">Yes</button>
				<button class="play-again-no">No</button>
			</div>

			<div class="win">
				<h4>&#128144; Congratulations &#128144;</h4>
				<img src="images/happy.jpg" alt="sad">
				<h4>You popped <span class="current-score">*</span> balloon(s)</h4>
				<h4 class="champion">You are a champion</h4>
			</div>

		</div>
	</div>


	<!-- Giải lập tạo 1 balloon -->
	<!-- <div class="balloon balloon-blue"></div>
	<div class="balloon balloon-violet"></div> -->

	<!-- Khu vực hiển thị số điểm, số quả bóng đã bị vỡ -->
	<div class="score-block">
		<p class="popped">You popop <span class="current-score">0</span> balloon(s)</p>
		<p>Level 1: Total Block = <span class="total-score">88</span>(s)</p>
	</div>



	<script src="js/script.js"></script>
</body>
</html>
