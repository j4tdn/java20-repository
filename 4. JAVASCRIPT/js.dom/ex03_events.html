<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Ex03 - Js Event Types and Handler</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body>

	<h1 class="text-primary">Ex03 - Js Event Types and Handler - 10.08.2024</h1>

	<hr>

	<button class="btn btn-warning m-2 sbm">
	    Click me !
	</button>

	<button class="btn btn-warning m-2" data-bs-toggle="modal" data-bs-target="#exampleModal">>
	    Click to show modal !
	</button>

	<hr>

	<div class="btne-container">
		<button class="btn btn-primary m-2 btn-e1">
			Button A1
		</button>

		<button class="btn btn-primary m-2 btn-e2">
			Button A2
		</button>

		<button class="btn btn-primary m-2 btn-e3">
			Button A3
		</button>

		<button class="btn btn-primary m-2 btn-e4">
			Button A4
		</button>
	</div>

	<form class="m-2">
		<div class="m-2">
			<input type="text" placeholder="input-1" class="input1">
		</div>
		<div class="m-2">
			<input type="text" placeholder="input-2" class="input2">
		</div>
	</form>

	<hr>

	<h3>Form 2</h3>

	<form class="form-2 m-2">
		<div>
			<label for="fname">First name: </label>
			<input id="fname" type="text" />
		</div>
		<div>
			<label for="lname">Last name: </label>
			<input id="lname" type="text" />
		</div>
		<div>
			<input id="submit" type="submit" />
		</div>
	</form>
	<p class="p2"></p>

	<!-- Modal -->
	<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>
				<div class="modal-body">
					<h3>This is a paragraph for modal body</h3>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
					<button type="button" class="btn btn-primary">Save changes</button>
				</div>
			</div>
		</div>
	</div>


	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
	<script src="ex03_events.js"></script>

</body>
</html>
