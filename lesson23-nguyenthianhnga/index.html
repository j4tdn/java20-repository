<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="author">
  <title> Budget App</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="http://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
   <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>


  <main class="main">
   <div class="top">
    <div class="budget">
      <div class="budget__title">
        Available Budget in <span class="budget__title--month">%Month%</span>:
      </div>

      <div class="budget__value">10</div>

      <div class="budget__income clearfix">
        <div class="budget__income--text">Income</div>
        <div class="right">
          <div class="budget__income--value"></div>
          <div class="budget__income--percentage">&nbsp;</div>
        </div>
      </div>

      <div class="budget__expenses clearfix">
        <div class="budget__expenses--text">Expenses</div>
        <div class="right clearfix">
          <div class="budget__expenses--value"></div>
          <div class="budget__expenses--percentage"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="bottom">
    <div class="add">
      <div class="add__container">
        <select class="add__type">
          <option value="inc" selected>+</option>
          <option value="exp">-</option>
        </select>
        <input type="text" class="add__description" placeholder="Add description">
        <input type="number" class="add__value" placeholder="Value">
        <button class="add__btn"><i class="ion-ios-checkmark-outline"></i></button>
      </div>
    </div>

    <div class="container clearfix">
      <div class="income">
        <h2 class="income__title">Income</h2>

        <div class="income__list">
          <ul class="lists">
          <!-- <li>
            <span>Ex1</span>
            <div class="list__income">
              +<span class="income-value">1</span>.00
              <span class="remove"><i class="fa-regular fa-circle-xmark"></i></span>
            </div>
          </li> -->
         
        </ul>
        </div>
      </div>

      <div class="expenses">
        <h2 class="expenses__title">Expenses</h2>

        <div class="expenses__list">
          <ul class="lists expenses">
           <!-- <li>
            <span>Ex1</span>
            <div class ="list__expenses">
              -<span class="expenses-value">1</span>.00
              <span class="percent">100%</span>
              <span class="remove"><i class="fa-regular fa-circle-xmark"></i></span>
            </div>
          </li>  -->
        </ul>
        </div>
      </div>
    </div>


  </div>
</main>


<script src="js/main.js"></script>
</body>
</html>
