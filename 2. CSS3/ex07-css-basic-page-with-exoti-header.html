<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex07 - Css Basic Page With Exoti Header</title>

	<style>
		* {
			box-sizing: border-box;
		}

		ul {
			margin: 0;
			padding: 0;
		}

		#header {
			height: 60px;
			background-color: #2b2b2b;
		}

		.wrapper {
			width: 80%;
			height: 100%;
			margin: 0 auto;
		}

		.page-logo {
			float: left;

			/*trick*/
			/*line-height: 60px;*/

			/*(60-19)/2*/
			margin-top: 20px;
		}

		.page-links {
			float: right;
		}

		.page-links li {
			float: left;
			list-style: none;
			margin-left: 70px;
			line-height: 60px;
		}

		.page-links li a {
			text-decoration: none;
			color: #FFFFFF;
		}

		.page-links li a:hover:after {
			content: '';
			display: block;
			width: 100%; /*100% so với width của thẻ a*/
			height: 2px;
			background-color: red;
			margin-top: -18px;
		}
	</style>
</head>
<body>

	<div id="header">
		<div class="wrapper">
			<div class="page-logo">
				<a href="#">
					<img src="images/logo.png" alt="logo">
				</a>
			</div>
			<ul class="page-links">
				<li><a href="#">HOME</a></li>
				<li><a href="#">ABOUT</a></li>
				<li><a href="#">SERVICES</a></li>
				<li><a href="#">INVESTORS</a></li>
				<li><a href="#">CONTACT</a></li>
			</ul>
		</div>
	</div>

	<h2 class="text-center title">Page Ex07 - Css Basic Page With Exoti Header</h2>
	<hr>

</body>
</html>
