<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex20 - CSS FLEX - Basic</title>

	<style>
		
		.container {
			border: 2px dotted limegreen;
			min-height: 800px;

			display: flex;
			background-color: #76b5c5;
		}

		.item {
			background-color: orange;
			border: 1px solid darkblue;
			height: 200px;
			width: 180px;
		}

		.item1{
			flex-basis: 220px;
			max-width: 150px; /*flex-basic still obey max-width*/
		}
		.item2{
			flex-basis: 400px;
		}

		.item3{
			flex-basis: 220px;
			min-width: 310px;
		}

	</style>
</head>
<body>
	
	<h2 class="text-center title">Page - Ex20 - CSS FLEX - Basic</h2>

	<hr>

	<div class="container">
		<div class="item item1">Element 1</div>
		<div class="item item2">Element 2</div>
		<div class="item item3">Element 3</div>
	</div>


</body>
</html>
