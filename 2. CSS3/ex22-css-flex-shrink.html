<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex22 - CSS FLEX - Shrink</title>

	<style>
		* {
			box-sizing: border-box;
		}
		.container {
			border: 2px dotted limegreen;
			width: 600px;
			display: flex;
			background-color: #76b5c5;
		}

		.item {
			background-color: orange;
			border: 1px solid darkblue;
			height: 60px;
			width: 100px;

		}

		.item1{
			width: 100px;
			flex-shrink: 1;
			/* new width = [(flex shrink * width) / total of width] * negative missing space */
		}
		.item2{
			width: 400px;
			flex-shrink: 1;
		}

		.item3{
			width: 400px;
			flex-shrink: 1;
		}

	</style>
</head>
<body>
	
	<h2 class="text-center title">Page - Ex22 - CSS FLEX - Shrink</h2>

	<hr>

	<div class="container">
		<div class="item item1">Element 1</div>
		<div class="item item2">Element 2</div>
		<div class="item item3">Element 3</div>
	</div>


</body>
</html>
