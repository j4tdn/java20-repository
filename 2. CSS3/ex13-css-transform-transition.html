<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex13 - CSS Transform - Transition</title>

	<style>
		
		.block {
			width: 140px;
			height: 140px;
/*			background-color: yellow;*/
			border: 1px solid lightgray;

			background-image: linear-gradient(yellow, blue);
			
			transition: all 1s 2s linear;
		}

		.block:hover {
			border-radius: 50%;
			background-image: linear-gradient(-45deg, yellow, blue, red, orange);
			transform: translate(300px, 200px);
		}

	</style>
</head>
<body>
	
	<h2 class="text-center title">Page - Ex13 - CSS Transform - Transition</h2>

	<hr>

	<div class="block"></div>


</body>
</html>
