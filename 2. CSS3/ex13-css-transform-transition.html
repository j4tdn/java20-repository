<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex13 - Css Transform - Transition</title>

	<style>
		.block {
			width: 120px;
			height: 120px;
			background-color: orange;
			border: 2px solid grey;

			transition: all 1s 0.5s linear;
		}

		.block:hover {
			border-radius: 50%;
			background-color: orangered;
			transform: translate(200px, 50px);
		}
	</style>
</head>
<body>

	<h2 class="text-center title">Page Ex13 - Css Transform - Transition</h2>
	<hr>

	<div class="block"></div>

</body>
</html>
