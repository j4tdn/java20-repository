<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex08 - CSS Background Properties</title>

	<style>
		body {
			background-color: lightgreen;
		}

		.w8-h4 {
			width: 800px;
			height: 400px;
		}

		.whx {
			width: 630px;
			height: 730px;
		}

		.m-center {
			margin: 50px auto;
		}

		#bg-elm-1 {
			background-color: plum;
			background-image: url(images/cupcake.png);
			background-repeat: no-repeat;
			background-size: 200px 200px;
			background-position: center center;
		}

		#bg-elm-2 {
			background-color: lightsalmon;
			background-image: url(images/cupcake.png);
			background-repeat: no-repeat;
			background-position: center center;
			background-size: cover;
		}
	</style>
</head>
<body>

	<h2 class="text-center title">Ex08 - CSS Background Properties</h2>
	<hr>

	<div class="m-center w8-h4" id="bg-elm-1"></div>
	<div class="m-center w8-h4 whx" id="bg-elm-2"></div>

</body>
</html>
