<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex08 - CSS Background Property</title>

	<style>

		body {
			background-color: #C6E0B4;
		}
		
		.w8h4 {
			width: 800px;
			height: 400px;
		}

		.whx {
			width: 630px;
			height: 730px;
		}

		.m-center {
			margin: 50px auto;
		}

		#bg-elm-1 {
			background-color: purple;
			background-image: url(images/cupcake.png);
			background-repeat: no-repeat;
			background-size: 200px 200px;
			background-position: center center;
		}

		#bg-elm-2 {
			background-color: orange;
			background-image: url(images/cupcake.png);
			/*yêu cầu: w/h của element phải tỉ lệ với w/h của background-image*/
			background-size: cover;

			background-repeat: no-repeat;

		}

	</style>

</head>
<body>

	<h2 class="text-center title">Page - Ex08 CSS Background Property</h2>

	<hr>

	<div class="m-center w8h4" id="bg-elm-1"></div>

	<div class="m-center whx" id="bg-elm-2"></div>

</body>
</html>
