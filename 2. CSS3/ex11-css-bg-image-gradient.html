<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex11 - Css Background Image - Gradient</title>

	<style>
		.block {
			width: 150px;
			height: 150px;

			margin: 20px auto;
			line-height: 150px;
			text-align: center;
			color: #fff;
		}

		.block-1 {
			background-image: linear-gradient(yellow, blue, red);
		}

		.block-2 {
			background-image: linear-gradient(45deg, yellow, blue, red, orange);
		}

		.block-3 {
			background-image: radial-gradient(circle, #f27, #bc8, #125);
			border-radius: 50%;
		}

		.block-4 {
			background-image: linear-gradient(45deg, 
				yellow 0%, yellow 30%, blue 30%, blue 60%, red 60%, red 100%);
			border-radius: 20px 60px;
			opacity: 0.4; /* độ mờ */
		}

		.block-5 {
			background-image: linear-gradient(30deg, 
				yellow 10%, blue 65%, red 95%);
			box-shadow: 20px 15px 12px grey;
		}

		.container .block {
			margin: 0 auto;
			float: left;
		}

		.block-1a {
			background-image: linear-gradient(-45deg, yellow, blue, red, orange);
		}

		.block-2b {
			background-image: linear-gradient(45deg, yellow, blue, red, orange);
		}

		.block-3c {
			background-image: linear-gradient(-135deg, yellow, blue, red, orange);
			clear: left;
		}

		.block-4d {
			background-image: linear-gradient(135deg, yellow, blue, red, orange);
		}

	</style>
</head>
<body>

	<h2 class="text-center title">Page Ex11 - Css Background Image - Gradient</h2>
	<hr>

	<div class="block block-1">block 1</div>
	<div class="block block-2">block 2</div>

	<div class="container">
		<div class="block block-1a"></div>
		<div class="block block-2b"></div>
		<div class="block block-3c"></div>
		<div class="block block-4d"></div>
	</div>

	<div class="block block-3">block 3</div>
	<div class="block block-4">block 4</div>
	<div class="block block-5">block 5</div>

</body>
</html>
