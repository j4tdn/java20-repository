<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex05 - Css Float Clear Properties Test 02</title>

	<style>
		.container div:nth-child(-n+3) {
			float: left;
		}

		.container div:nth-child(4) {
			clear: left;
		}
	</style>
</head>
<body>

	<h2 class="text-center title">Page Ex05 - Css Float Clear Properties Test 02</h2>
	<hr>

	<div class="container">
		<div class="block-1 bg-red"></div>
		<div class="block-1 bg-green"></div>
		<div class="block-1 bg-yellow"></div>
		<div class="block-1 bg-pink"></div>
		<div class="block-1 bg-blue"></div>
	</div>

</body>
</html>
