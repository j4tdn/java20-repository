<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex12 - CSS Selector</title>

	<style>

		/*
			Selector
			==============================
			X: X --> tag name
			.X: X --> class name/value
			#X: X --> id name/value
			B.X: B --> tag name, X --> class name/value
			B#X: B --> tag name, X --> class name/value
			X Y: X, Y --> tag name
						tìm element Y nào mà con của X (bậc 1 hoặc bậc N)
			X>Y: X, Y --> tag name
						tìm element Y nào mà con của X (bậc 1)
			X+Y: X, Y --> tag name
						tìm Y nào mà cùng level với X, nằm sau X(level 1 Y ngay sau X)
			X~Y: X, Y --> tag name
						tìm Y nào mà cùng level với X, nằm sau X(mọi level)
			*:	tất cả các element
			X[attribute]

			pseudo-classes
			==============================
			position
			==============================
			X:first-child
			  --> Tìm element X thỏa mãn X là thẻ con đầu tiên của element nào đó
			  --> VD:
			      <T>
                     <X> --> OK
			      </T>

			      <T>
			      	 <Z> -->
                     <X> --> KO OK
			      </T>
			X:first-of-type
			  --> Tìm element X đầu tiên bên trong element nào đó, ko nhất thiết X phải là thẻ con đầu tiên
			  --> VD:
			      <T>
                     <X> --> OK
			      </T>

			      <T>
			      	 <Z> -->
                     <X> --> OK
			      </T>
		*/

		ul a {
			color: red;
		}

		ol > li > a {
			color: pink;
		}

		h1~p {
			color: green;
		}

		h1+p {
			text-transform: uppercase;
		}

		ul li, ol li {
			list-style: none;
		}

		a[href^='https'] {
			text-decoration:  none;
		}

		a[href*='choco']:hover {
			text-decoration: underline;
		}

		.divblock p:first-child {
			border: 2px dashed blue;
		}

		.divblock h3:first-of-type {
			border: 2px dashed red;
		}

	</style>

</head>
<body>

	<h2 class="text-center title">Page - Ex12 CSS Selector</h2>

	<hr>

	<h1>Coffee &amp; Cake</h1>
	<p>We have been banking and brewing</p>
	<h2>Our menu:</h2>
	<ul>
		<li><a href="https://choco.com">Chocolate cupcake</a></li>
		<li><a href="https://vanila.com">Vanilla cupcake</a></li>
	</ul>
	<ol>
		<li><a href="">Americano</a></li>
		<li><a href="">Espresso</a></li>
	</ol>
	<div class="divblock">
		<p>Read what customer say <a href="">about us</a></p>
		<h3>H3 - Test</h3>
		<p>Hello 1</p>
		<p>Hello 2</p>
		<p>Hello 3</p>
	</div>
	<p>We hope to you soon</p>

</body>
</html>
