<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex18 - CSS FLEX - Align-self</title>

	<style>
		
		.container {
			border: 2px dotted limegreen;

			height: 800px;

			display: flex;
		}

		.item {
			background-color: orange;
			border: 1px solid darkblue;
		}

		.item1{
			width: 200px;
		}

		.item2{
			width: 340px;
			align-self: stretch;
		}

		.item3{
			height: 150px;
			width: 150px;
			align-self: flex-end;
		}
		

	</style>
</head>
<body>
	
	<h2 class="text-center title">Page - Ex18 - CSS FLEX - Align-self</h2>

	<hr>

	<div class="container">
		<div class="item item1">Element 1</div>
		<div class="item item2">Element 2</div>
		<div class="item item3">Element 3</div>
	</div>


</body>
</html>
