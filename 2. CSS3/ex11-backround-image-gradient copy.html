<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex11 - CSS Background Gradient</title>

	<style>

		.block {
			width: 200px;
			height: 200px;
            line-height: 200px;
            text-align: center;
            color: #fff;
            margin: 20px auto;
        }

        .block-1a {
            background-image: linear-gradient(45deg,yellow,blue, red);
        }

        .block-2a {
            background-image: linear-gradient(135deg, yellow,blue, red, orange);
        }
        

	</style>
</head>
<body>

	<h2 class="text-center title">Ex11 - CSS Background Gradient</h2>
    <hr>
    <div class="block block-1">BLOCK 1</div>
    <div class="block block-2">BLOCK 2</div>
</body>
</html>
