<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex16 - CSS FLEX - Parent Property</title>

	<style>

		* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
		}

		ul li {
			list-style: none;
		}

		a {
			text-decoration: none;
			color: #000;
		}
		
		#page-header {
			width: 100%;
			height: 68px;
			background-color: #f7c61d;
		}

		.wrapper {
			margin: 0 auto;
			width: 88%;
			height: 100%;
		}

		#page-header .wrapper {
			display: flex;
		}

		#page-header .wrapper > * {
			width: 33.33%;
			align-items: center;
		}

		.nav-left {
			display: flex;
			justify-content: space-around;
		}

		.page-logo {
			display: flex;
			justify-content: center;
		}

		.nav-right {
			display: flex;
			justify-content: space-around;
		}

	</style>
</head>
<body>
	
	<header id="page-header">
		<div class="wrapper">
			<ul class="nav-left">
				<li><a href="#">Culture</a></li>
				<li><a href="#">Events</a></li>
				<li><a href="#">Food</a></li>
			</ul>

			<div class="page-logo">
				<a href="#"><img src="images/gotham-logo.png" alt="gotham"></a>
			</div>

			<ul class="nav-right">
				<li><a href="#">Travelling</a></li>
				<li><a href="#">Fashion</a></li>
				<li><a href="#">Other</a></li>
			</ul>
		</div>
	</header>


</body>
</html>
