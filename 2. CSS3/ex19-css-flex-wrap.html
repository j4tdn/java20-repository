<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex19 - CSS FLEX - wrap</title>

	<style>
		
		.container {
			border: 2px dotted limegreen;

			min-height: 800px;

			display: flex;
			width: 800px;
			align-content: center;
			flex-wrap: nowrap;
		}

		.item {
			background-color: orange;
			border: 1px solid darkblue;
			height: 150px;
		}

		.item1{
			width: 200px;
			order: 3;
		}

		.item2{
			width: 340px;
		}

		.item3{
			height: 150px;
			width: 150px;
			order: 1;
		}

		.item4{
			height: 150px;
			width: 150px;
		}
		

	</style>
</head>
<body>
	
	<h2 class="text-center title">Page - Ex19 - CSS FLEX - wrap</h2>

	<hr>

	<div class="container">
		<div class="item item1">Element 1</div>
		<div class="item item2">Element 2</div>
		<div class="item item3">Element 3</div>
		<div class="item item4">Element 4</div>
	</div>


</body>
</html>
