<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex13 - CSS Transform - Transition</title>

	<style>

		.block {
			width: 140px;
			height: 140px;
			background-color: yellow;
			border: 1px solid lightgray;

			transition: all 1s 2s linear;
		}

		.block:hover {
			border-radius: 50%;
			/*background-color: red;*/
			transform: translate(300px, 200px);
			background-image: linear-gradient(-45deg, yellow, blue, red, orange);
		}

	</style>
</head>

<body>
	
	<h2 class="text-center title">Page - CSS Transform - Transition</h2>

	<hr>

	<div class="block"></div>

</body>
</html>
