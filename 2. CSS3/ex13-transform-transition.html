<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex11 - CSS Background Gradient</title>

	<style>
        .block {
			width: 140px;
			height: 140px;
			background-color: yellow;
			border: 1px solid lightgray;
			transform: translateX(40px);
			transition: all 1s 1s;
		}

		.block:hover {
			border-radius: 50%;
			background-color: yellowgreen;
			transform: translate(300px, 200px);
		}
	</style>
</head>
<body>

	<h2 class="text-center title">Page - CSS Background Gradient</h2>
    
	<hr>
    
	<div class="block"></div>
</body>
</html>
