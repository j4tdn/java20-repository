<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="images/3208723.png">
	<title>LESSON 22 -Todo app</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<p class="message invisible">Task content cannot be empty !!! Please text something</p>
	<div class="todo-block">
		<div class="todo-header">
			<h1 class="title">TODO APP</h1>
		</div>
		<div class="todo-body">
			<form action="" class="todo-form">
				<input class="todo-text" type="text" placeholder="A task you want to complete">
				<input class="btn-add" type="button" value="+">
			</form>
			<ul class="tasks">
				<li class="task">
					<div class="cbx-block">
						<input type="checkbox" class="cbx-done">
					</div>
					<p class="task-content">Task 1</p>
					<button class="btn-remove"></button>
				</li>
				<li class="task">
					<div class="cbx-block">
						<input type="checkbox" class="cbx-done">
					</div>
					<p class="task-content">Task 2</p>
					<button class="btn-remove"></button>
				</li>
				<li class="task">
					<div class="cbx-block">
						<input type="checkbox" class="cbx-done">
					</div>
					<p class="task-content">Task 3</p>
					<button class="btn-remove"></button>
				</li>
			</ul>
		</div>
	</div>
</body>
<script type="text/javascript" src="js/main.js"></script>
</html>
