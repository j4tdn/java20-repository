<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<link rel="icon" href="images/header.png">
	<link rel="stylesheet" href="css/style.css">
	<title>Ex11 - CSS Background Image  Gradient</title>

	<style>

		.block {
			width: 200px;
			height: 200px;

			/*demo display and visibility*/
			display: inline-block;
			margin: 0 auto;
		}
		.block-1{
			background-image: linear-gradient(-45deg,yellow,blue,red);
		}
		.block-2{
			background-image: linear-gradient(-135deg,yellow,blue,red);
		}
		.block-3{
			background-image: linear-gradient(45deg,yellow,blue,red);
		}
		.block-4{
			background-image: linear-gradient(135deg,yellow,blue,red);
		}


		.block-4{
			background-image: radial-gradient(circle,#fa2171.,#ccda83,#112255)
		}

	</style>
</head>
<body>
	<h2 class="text-center title">Page - Ex11 - CSS Background Image  Gradient</h2>

	<hr>

	<div class="block block-1 mvg-20"></div>
	<div class="block block-2 mvg-20"></div>
	<div class="block block-3 mvg-20"></div>
	

	<div class="container mgv-20">
	<div class="block block-1a"></div>
	<div class="block block-2a"></div>
	<div class="block block-3a"></div>
	<div class="block block-4a"></div>
	</div>
	

	<div class="block block-4 mvg-20"></div>
</body>
</html>
